services:
  mnestix-aas-generator:
    image: mnestix-aas-generator
    build: ./../.
    container_name: mnestix-aas-generator
    ports:
      - "5064:5064"
    environment:
      # Application Settings
      CustomerEndpointsSecurity__ApiKey: YOUR_API_KEY_HERE
      # Connection to BaSyx Go services:
      ReverseProxy__Clusters__aasRepoCluster__Destinations__destination1__Address: "http://aas-repository:8081/"
      ReverseProxy__Clusters__submodelRepoCluster__Destinations__destination1__Address: "http://submodel-repository:8081/"
      ReverseProxy__Clusters__discoveryCluster__Destinations__destination1__Address: "http://aas-discovery:8081/"
      # Features Configuration
      Features__AasRegistryMiddleware: true
      Features__AllowRetrievingAllShellsAndSubmodels: true
      Features__UseAuthentication: true
      # InfluxDB Configuration
      ReverseProxy__Clusters__influxCluster__Destinations__destination1__Address: "http://example/"
      ReverseProxy__Routes__InfluxRoute__Transforms__1__Set: "Token "
      # PostgreSQL Configuration (BaSyx Go backend)
      BasyxDbConnectionConfiguration__PostgresConnectionString: "Host=basyx-db;Port=5432;Database=basyxdb;Username=basyx;Password=basyx"
      BasyxDbConnectionConfiguration__AasTableName: "aas"
      # OpenId repository settings
      RepositoryOpenIdConnect__EnableRepositoryOpenIdAuth: "false"
      RepositoryOpenIdConnect__Authority: "http://keycloak:8080/realms/BaSyx"
      RepositoryOpenIdConnect__DiscoveryEndpoint: ".well-known/openid-configuration"
      RepositoryOpenIdConnect__ClientId: "mnestix-repo-client-demo"
      RepositoryOpenIdConnect__ClientSecret: "your-client-secret"
      RepositoryOpenIdConnect__ValidateIssuer: "false"
      RepositoryOpenIdConnect__TokenEndpoint: "http://keycloak:8080/realms/BaSyx/protocol/openid-connect/token"
      # Microsoft Authentication
      AzureAd__Domain: "your-domain.onmicrosoft.com"
      AzureAd__TenantId: your-tenant-id
      AzureAd__ClientId: your-client-id
      # OpenID Configuration
      OpenId__EnableOpenIdAuth: "false"
      OpenId__Issuer: "http://keycloak:8080/realms/BaSyx"
      OpenId__ClientID: "mnestixApi-demo"
      OpenId__RequireHttpsMetadata: "false"
      # ASP.NET Core URLs
      ASPNETCORE_URLS: "http://+:5064"
    depends_on:
      aas-repository:
        condition: service_healthy
      submodel-repository:
        condition: service_healthy
      aas-discovery:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  basyx-db:
    image: postgres:16-alpine
    container_name: basyx-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: basyx
      POSTGRES_PASSWORD: basyx
      POSTGRES_DB: basyxdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basyx -d basyxdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - basyx-db-data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  aas-repository:
    image: eclipsebasyx/aasrepository-go:1.0.0-rc.1
    container_name: aas-repository
    ports:
      - "8081:8081"
    environment:
      BASYX_PERSISTENCE_TYPE: postgres
      BASYX_PERSISTENCE_POSTGRES_HOST: basyx-db
      BASYX_PERSISTENCE_POSTGRES_PORT: "5432"
      BASYX_PERSISTENCE_POSTGRES_DATABASE: basyxdb
      BASYX_PERSISTENCE_POSTGRES_USER: basyx
      BASYX_PERSISTENCE_POSTGRES_PASSWORD: basyx
      BASYX_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5064"
      BASYX_CORS_ALLOWED_METHODS: "GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD"
      BASYX_AUTHORIZATION_ENABLED: "false"
    depends_on:
      basyx-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/shells || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  submodel-repository:
    image: eclipsebasyx/submodelrepository-go:1.0.0-rc.1
    container_name: submodel-repository
    ports:
      - "8082:8081"
    environment:
      BASYX_PERSISTENCE_TYPE: postgres
      BASYX_PERSISTENCE_POSTGRES_HOST: basyx-db
      BASYX_PERSISTENCE_POSTGRES_PORT: "5432"
      BASYX_PERSISTENCE_POSTGRES_DATABASE: basyxdb
      BASYX_PERSISTENCE_POSTGRES_USER: basyx
      BASYX_PERSISTENCE_POSTGRES_PASSWORD: basyx
      BASYX_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5064"
      BASYX_CORS_ALLOWED_METHODS: "GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD"
      BASYX_AUTHORIZATION_ENABLED: "false"
    depends_on:
      basyx-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/submodels || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  aas-discovery:
    image: eclipsebasyx/aasdiscovery-go:1.0.0-rc.1
    container_name: aas-discovery
    ports:
      - "8083:8081"
    environment:
      BASYX_PERSISTENCE_TYPE: postgres
      BASYX_PERSISTENCE_POSTGRES_HOST: basyx-db
      BASYX_PERSISTENCE_POSTGRES_PORT: "5432"
      BASYX_PERSISTENCE_POSTGRES_DATABASE: basyxdb
      BASYX_PERSISTENCE_POSTGRES_USER: basyx
      BASYX_PERSISTENCE_POSTGRES_PASSWORD: basyx
      BASYX_CORS_ALLOWED_ORIGINS: '*'
      BASYX_CORS_ALLOWED_METHODS: "GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD"
      BASYX_AUTHORIZATION_ENABLED: "false"
    depends_on:
      basyx-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/lookup/shells || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  keycloak:
    build:
      context: ./data/keycloak
    container_name: keycloak
    volumes:
      - ./data/keycloak/realm:/opt/jboss/keycloak/imports
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_SPI_INITIALIZER_ISSUER_BASE_URI: http://keycloak:8080
      KC_HEALTH_ENABLED: true
    command: [ "start-dev", "--import-realm" ]
    healthcheck:
      test: [
        "CMD-SHELL",
        'exec 3<>/dev/tcp/localhost/8080; echo -e "GET /health/ready HTTP/1.1\nhost: localhost:8080\n" >&3; timeout --preserve-status 1 cat <&3 | grep -m 1 status | grep -m 1 UP; ERROR=$?; exec 3<&-; exec 3>&-; exit $ERROR'
      ]
      interval: 30s
      timeout: 10s
      retries: 6

volumes:
  basyx-db-data: