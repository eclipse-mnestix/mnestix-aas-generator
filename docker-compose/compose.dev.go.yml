services:
  mnestix-browser:
    image: mnestix/mnestix-browser:2.2.0
    container_name: mnestix-browser
    ports:
      - "3000:3000"
    environment:
      AAS_REPO_API_URL: "http://mnestix-proxy:5065/repo"
      SUBMODEL_REPO_API_URL: "http://mnestix-proxy:5065/repo"
      CONCEPT_DESCRIPTION_REPO_API_URL: "http://mnestix-proxy:5065/repo"
      SERIALIZATION_API_URL: "http://mnestix-proxy:5065/repo"
      DISCOVERY_API_URL: "http://mnestix-proxy:5065/discovery"
      MNESTIX_AAS_GENERATOR_API_URL: "http://mnestix-proxy:5065"
      MNESTIX_BACKEND_API_KEY: "verySecureApiKey"
      AAS_LIST_FEATURE_FLAG: "true"
      COMPARISON_FEATURE_FLAG: "true"
      AUTHENTICATION_FEATURE_FLAG: "false"
      LOCK_TIMESERIES_PERIOD_FEATURE_FLAG: "true"
      BASYX_RBAC_ENABLED: "false"
      NEXTAUTH_SECRET: "verySecureNextAuthSecret"
      SECRET_ENC_KEY: "J+mMxwKo+aoFJ6uxMv6Acv54buuBir2EJ3z6LGFB+Vo="
    depends_on:
      mnestix-proxy:
        condition: service_started
    volumes:
      - mnestix-database:/app/prisma/database

  mnestix-proxy:
    image: mnestix/mnestix-proxy:1.0.0
    container_name: mnestix-proxy
    ports:
      - "5065:5065"
    environment:
      CustomerEndpointsSecurity__ApiKey: "verySecureApiKey"
      ReverseProxy__Clusters__mnestixApiCluster__Destinations__destination1__Address: "http://mnestix-aas-generator:5064/"
      ReverseProxy__Clusters__aasRepoCluster__Destinations__destination1__Address: "http://aas-repository:8081/"
      ReverseProxy__Clusters__submodelRepoCluster__Destinations__destination1__Address: "http://submodel-repository:8081/"
      ReverseProxy__Clusters__discoveryCluster__Destinations__destination1__Address: "http://aas-discovery:8081/"
      ReverseProxy__Clusters__influxCluster__Destinations__destination1__Address: "http://example/"
      ReverseProxy__Routes__InfluxRoute__Transforms__1__Set: "Token "
      ASPNETCORE_URLS: "http://+:5065"
    depends_on:
      aas-repository:
        condition: service_healthy
      submodel-repository:
        condition: service_healthy
      aas-discovery:
        condition: service_healthy

  mnestix-aas-generator:
    image: mnestix-aas-generator
    build: ./../.
    container_name: mnestix-aas-generator
    ports:
      - "5064:5064"
    environment:
      CustomerEndpointsSecurity__ApiKey: "verySecureApiKey"
      Features__UseAuthentication: "false"
      ASPNETCORE_URLS: "http://+:5064"
      ServerUrls: "http://mnestix-proxy:5065/repo/"
      BasyxDbConnectionConfiguration__PostgresConnectionString: "Host=basyx-db;Port=5432;Database=basyxdb;Username=basyx;Password=basyx"
      BasyxDbConnectionConfiguration__AasTableName: "aas"
    depends_on:
      mnestix-proxy:
        condition: service_started
      aas-repository:
        condition: service_healthy
      submodel-repository:
        condition: service_healthy
      aas-discovery:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  basyx-db:
    image: postgres:16-alpine
    container_name: basyx-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: basyx
      POSTGRES_PASSWORD: basyx
      POSTGRES_DB: basyxdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basyx -d basyxdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - basyx-db-data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  db-schema-init:
    image: postgres:16-alpine
    container_name: db-schema-init
    environment:
      POSTGRES_HOST: basyx-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: basyx
      POSTGRES_PASSWORD: basyx
      POSTGRES_DB: basyxdb
    command: ["sh", "/init/init-schema.sh"]
    volumes:
      - ./data/basyxschema.sql:/schema/basyxschema.sql:ro
      - ./data/db_init/init-schema.sh:/init/init-schema.sh:ro
    depends_on:
      basyx-db:
        condition: service_healthy
    restart: "no"

  aas-repository:
    image: eclipsebasyx/aasrepository-go:1.0.0-rc.1
    container_name: aas-repository
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      POSTGRES_HOST: basyx-db
      POSTGRES_PORT: "5432"
      POSTGRES_DBNAME: basyxdb
      POSTGRES_USER: basyx
      POSTGRES_PASSWORD: basyx
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDMETHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWEDCREDENTIALS: "true"
      ABAC_ENABLED: "false"
    depends_on:
      db-schema-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  submodel-repository:
    image: eclipsebasyx/submodelrepository-go:1.0.0-rc.1
    container_name: submodel-repository
    ports:
      - "8082:8081"
    environment:
      SERVER_PORT: "8081"
      POSTGRES_HOST: basyx-db
      POSTGRES_PORT: "5432"
      POSTGRES_DBNAME: basyxdb
      POSTGRES_USER: basyx
      POSTGRES_PASSWORD: basyx
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDMETHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWEDCREDENTIALS: "true"
      ABAC_ENABLED: "false"
    depends_on:
      db-schema-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  aas-discovery:
    image: eclipsebasyx/aasdiscovery-go:1.0.0-rc.1
    container_name: aas-discovery
    ports:
      - "8083:8081"
    environment:
      SERVER_PORT: "8081"
      POSTGRES_HOST: basyx-db
      POSTGRES_PORT: "5432"
      POSTGRES_DBNAME: basyxdb
      POSTGRES_USER: basyx
      POSTGRES_PASSWORD: basyx
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDMETHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWEDCREDENTIALS: "true"
      ABAC_ENABLED: "false"
    depends_on:
      db-schema-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

volumes:
  basyx-db-data:
  mnestix-database:
