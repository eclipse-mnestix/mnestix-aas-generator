services:
  mnestix-browser:
    image: mnestix/mnestix-browser:dev
    container_name: mnestix-browser
    ports:
      - "3000:3000"
    env_file:
      - ./.env.local
    environment:
      - AAS_REPO_API_URL
      - SUBMODEL_REPO_API_URL
      - CONCEPT_DESCRIPTION_REPO_API_URL
      - SERIALIZATION_API_URL
      - DISCOVERY_API_URL
      - MNESTIX_AAS_GENERATOR_API_URL
      - MNESTIX_BACKEND_API_KEY
      - AAS_LIST_FEATURE_FLAG
      - COMPARISON_FEATURE_FLAG
      - AUTHENTICATION_FEATURE_FLAG
      - LOCK_TIMESERIES_PERIOD_FEATURE_FLAG
      - BASYX_RBAC_ENABLED
      - NEXTAUTH_SECRET
      - SECRET_ENC_KEY
    depends_on:
      mnestix-proxy:
        condition: service_started
    volumes:
      - mnestix-database:/app/prisma/database

  mnestix-proxy:
    image: mnestix/mnestix-proxy:dev
    container_name: mnestix-proxy
    ports:
      - "5065:5065"
    env_file:
      - ./.env.local
    environment:
      - CustomerEndpointsSecurity__ApiKey
      - ReverseProxy__Clusters__mnestixApiCluster__Destinations__destination1__Address
      - ReverseProxy__Clusters__aasRepoCluster__Destinations__destination1__Address
      - ReverseProxy__Clusters__submodelRepoCluster__Destinations__destination1__Address
      - ReverseProxy__Clusters__discoveryCluster__Destinations__destination1__Address
      - ReverseProxy__Clusters__influxCluster__Destinations__destination1__Address
      - ReverseProxy__Routes__InfluxRoute__Transforms__1__Set
      - ASPNETCORE_URLS=http://+:5065
    depends_on:
      aas-repository:
        condition: service_healthy
      submodel-repository:
        condition: service_healthy
      aas-discovery:
        condition: service_healthy

  mnestix-aas-generator:
    image: mnestix-aas-generator
    build: ./../.
    container_name: mnestix-aas-generator
    ports:
      - "5064:5064"
    env_file:
      - ./.env.local
    environment:
      - CustomerEndpointsSecurity__ApiKey
      - Features__UseAuthentication
      - ASPNETCORE_URLS=http://+:5064
      - ServerUrls
    depends_on:
      mnestix-proxy:
        condition: service_started
      aas-repository:
        condition: service_healthy
      submodel-repository:
        condition: service_healthy
      aas-discovery:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  basyx-db:
    image: postgres:16-alpine
    container_name: basyx-db
    ports:
      - "5432:5432"
    env_file:
      - ./.env.local
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basyx -d basyxdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - basyx-db-data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  db-schema-init:
    image: postgres:16-alpine
    container_name: db-schema-init
    env_file:
      - ./.env.local
    environment:
      - POSTGRES_HOST
      - POSTGRES_PORT
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    command: ["sh", "/init/init-schema.sh"]
    volumes:
      - ./data/basyxschema.sql:/schema/basyxschema.sql:ro
      - ./data/db_init/init-schema.sh:/init/init-schema.sh:ro
    depends_on:
      basyx-db:
        condition: service_healthy
    restart: "no"

  aas-repository:
    image: eclipsebasyx/aasrepository-go:1.0.0-rc.1
    container_name: aas-repository
    ports:
      - "8081:8081"
    env_file:
      - ./.env.local
    environment:
      - SERVER_PORT
      - POSTGRES_HOST
      - POSTGRES_PORT
      - POSTGRES_DBNAME
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - CORS_ALLOWEDORIGINS
      - CORS_ALLOWEDMETHODS
      - CORS_ALLOWEDHEADERS
      - CORS_ALLOWEDCREDENTIALS
      - ABAC_ENABLED
    depends_on:
      db-schema-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  submodel-repository:
    image: eclipsebasyx/submodelrepository-go:1.0.0-rc.1
    container_name: submodel-repository
    ports:
      - "8082:8081"
    env_file:
      - ./.env.local
    environment:
      - SERVER_PORT
      - POSTGRES_HOST
      - POSTGRES_PORT
      - POSTGRES_DBNAME
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - CORS_ALLOWEDORIGINS
      - CORS_ALLOWEDMETHODS
      - CORS_ALLOWEDHEADERS
      - CORS_ALLOWEDCREDENTIALS
      - ABAC_ENABLED
    depends_on:
      db-schema-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  aas-discovery:
    image: eclipsebasyx/aasdiscovery-go:1.0.0-rc.1
    container_name: aas-discovery
    ports:
      - "8083:8081"
    env_file:
      - ./.env.local
    environment:
      - SERVER_PORT
      - POSTGRES_HOST
      - POSTGRES_PORT
      - POSTGRES_DBNAME
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - CORS_ALLOWEDORIGINS
      - CORS_ALLOWEDMETHODS
      - CORS_ALLOWEDHEADERS
      - CORS_ALLOWEDCREDENTIALS
      - ABAC_ENABLED
    depends_on:
      db-schema-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

volumes:
  basyx-db-data:
  mnestix-database:
