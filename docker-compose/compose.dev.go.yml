services:
  mnestix-browser:
    image: mnestix/mnestix-browser:dev
    container_name: mnestix-browser
    ports:
      - "3000:3000"
    env_file:
      - ./.env.local
    depends_on:
      mnestix-proxy:
        condition: service_started
    volumes:
      - mnestix-database:/app/prisma/database

  mnestix-proxy:
    image: mnestix/mnestix-proxy:dev
    container_name: mnestix-proxy
    ports:
      - "5065:5065"
    env_file:
      - ./.env.local
    environment:
      - ASPNETCORE_URLS=http://+:5065
    depends_on:
      aas-repository:
        condition: service_healthy
      submodel-repository:
        condition: service_healthy
      aas-discovery:
        condition: service_healthy

  mnestix-aas-generator:
    image: mnestix-aas-generator
    build: ./../.
    container_name: mnestix-aas-generator
    ports:
      - "5064:5064"
    env_file:
      - ./.env.local
    environment:
      - ASPNETCORE_URLS=http://+:5064
    depends_on:
      mnestix-proxy:
        condition: service_started
      aas-repository:
        condition: service_healthy
      submodel-repository:
        condition: service_healthy
      aas-discovery:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  basyx-db:
    image: postgres:16-alpine
    container_name: basyx-db
    ports:
      - "5432:5432"
    env_file:
      - ./.env.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basyx -d basyxdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - basyx-db-data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"


  aas-repository:
    image: eclipsebasyx/aasrepository-go:1.0.0-rc.1
    container_name: aas-repository
    ports:
      - "8081:8081"
    env_file:
      - ./.env.local
    healthcheck:
      test: ["CMD", "/bin/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  submodel-repository:
    image: eclipsebasyx/submodelrepository-go:1.0.0-rc.1
    container_name: submodel-repository
    ports:
      - "8082:8081"
    env_file:
      - ./.env.local
    healthcheck:
      test: ["CMD", "/bin/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

  aas-discovery:
    image: eclipsebasyx/aasdiscovery-go:1.0.0-rc.1
    container_name: aas-discovery
    ports:
      - "8083:8081"
    env_file:
      - ./.env.local
    healthcheck:
      test: ["CMD", "/bin/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"

volumes:
  basyx-db-data:
  mnestix-database:
